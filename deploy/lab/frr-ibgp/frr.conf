frr defaults traditional
hostname frr-ibgp
log stdout
!
router bgp 65001
 bgp router-id 10.99.0.4
 no bgp network import-check
 neighbor 10.99.0.2 remote-as 65001
 neighbor fd00:99::2 remote-as 65001
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.99.0.2 activate
  no neighbor fd00:99::2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:4::/48
  neighbor fd00:99::2 activate
 exit-address-family
